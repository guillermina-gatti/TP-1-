<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icono de la pestaña -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <!-- Tipografía: Google Fonts (Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Hojas de estilo (CSS) -->
    <link rel="stylesheet" href="../css/componentes.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <!--Nombre de la página que aparece en la pestaña del navegador-->
    <title>Cartelera de Eventos | Indie Events Radar</title>
</head>

<body>
    <!-- Encabezado principal de la página, contiene la brújula y la navegación -->
    <header>
        <div class="nav-wrapper">
            <!-- Icono de brújula que rota según la página actual -->
            <svg class="nav-compass" id="nav-compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#333" stroke-width="2.5" />
                <circle cx="50" cy="50" r="42" fill="none" stroke="#555" stroke-width="0.8" />
                <line x1="50" y1="6" x2="50" y2="14" stroke="#333" stroke-width="2" />
                <line x1="50" y1="86" x2="50" y2="94" stroke="#333" stroke-width="2" />
                <line x1="6" y1="50" x2="14" y2="50" stroke="#333" stroke-width="2" />
                <line x1="86" y1="50" x2="94" y2="50" stroke="#333" stroke-width="2" />
                <text x="50" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#333"
                    font-family="Montserrat, sans-serif">N</text>
                <text x="50" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#333"
                    font-family="Montserrat, sans-serif">S</text>
                <text x="19" y="53.5" text-anchor="middle" font-size="9" font-weight="700" fill="#333"
                    font-family="Montserrat, sans-serif">O</text>
                <text x="81" y="53.5" text-anchor="middle" font-size="9" font-weight="700" fill="#333"
                    font-family="Montserrat, sans-serif">E</text>
                <polygon points="50,16 44,50 56,50" fill="#C0392B" />
                <polygon points="50,84 44,50 56,50" fill="#333" />
                <circle cx="50" cy="50" r="3.5" fill="#333" />
                <circle cx="50" cy="50" r="1.5" fill="#fff" />
            </svg>
            <!-- Navegación principal del sitio -->
            <nav>
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="eventos.html" class="active">Eventos</a></li>
                    <li><a href="agenda.html">Mi Agenda</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenido principal de la cartelera de eventos -->
    <main>
        <!-- Panel lateral para los filtros de búsqueda -->
        <aside class="filtros-seccion">
            <div class="filtro-grupo">
                <label for="filtro-buscar">Buscar</label>
                <input type="text" id="filtro-buscar" placeholder="Nombre del evento...">
            </div>
            <div class="filtro-grupo">
                <label for="filtro-fecha">Fecha</label>
                <input type="date" id="filtro-fecha" placeholder="dd/mm/aaaa">
            </div>
            <div class="filtro-grupo">
                <label for="filtro-categoria">Categoría</label>
                <select id="filtro-categoria">
                    <option value="" disabled selected>Selecciona una opción</option>
                </select>
            </div>
            <div class="filtro-grupo">
                <label for="filtro-precio">Precio</label>
                <select id="filtro-precio">
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Todos">Todos</option>
                    <option value="Gratuito">Gratuito</option>
                    <option value="Pago">Pago</option>
                </select>
            </div>
            <div class="filtro-grupo">
                <label for="filtro-estado">Estado</label>
                <select id="filtro-estado">
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Hoy">Hoy</option>
                    <option value="Proximamente">Proximamente</option>
                    <option value="Finalizado">Finalizado</option>
                </select>
            </div>
        </aside>

        <!-- Sección principal donde se muestra la cuadrícula de eventos -->
        <section class="grilla-eventos-seccion">
            <h2>Próximos Eventos</h2>
            <!-- Contenedor dinámico donde Javascript inyectará los elementos <article> de cada tarjeta -->
            <div id="contenedor-cards-eventos"></div>
        </section>

        <!-- Contenedor del modal de detalles del evento (fuera del flujo normal) -->
        <aside id="modal-detalle-evento" class="modal-oculto">
        </aside>
    </main>

    <!-- Enlace flotante de acción para contactar por WhatsApp -->
    <a href="https://wa.me/tunumerodecelular" class="btn-whatsapp" target="_blank">💬 WhatsApp</a>

    <!-- Pie de página con los derechos de autor -->
    <footer>
        <p>&copy; 2026 - Indie Events Radar. Todos los derechos reservados.</p>
    </footer>

    <!-- Carga de scripts: datos, utilidades y lógica específica de la vista de eventos -->
    <script src="../data/data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/eventos.js"></script>
</body>

</html>
